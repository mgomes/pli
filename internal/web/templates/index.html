<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-icon"><i data-lucide="clapperboard"></i></div>
          <span class="brand-name">pli</span>
        </div>

        <nav class="nav" id="section-nav">
          <button class="nav-item" data-section="recently-added">
            <i data-lucide="sparkles"></i>
            <span>Recently Added</span>
          </button>
          <button class="nav-item" data-section="tv">
            <i data-lucide="tv"></i>
            <span>TV Shows</span>
          </button>
          <button class="nav-item" data-section="movies">
            <i data-lucide="film"></i>
            <span>Movies</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-divider"></div>
          <button class="nav-item" data-section="settings">
            <i data-lucide="settings"></i>
            <span>Settings</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="section-title">Recently Added</h1>
            <p class="topbar-desc" id="section-description">Latest updates from your library cache.</p>
          </div>
          <div class="search-wrapper">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" class="search-input" id="search-input" placeholder="Search movies, shows, episodes... (/)" autocomplete="off" />
          </div>
        </header>

        <section id="content" class="content"></section>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
